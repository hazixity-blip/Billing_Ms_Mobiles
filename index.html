<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MS Mobile Billing</title>
<style>
:root{--g:#0f6b4f;--bg:#f2f5f3;--l:#d3ddd7}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:#16241d}
header{background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px}
header img{height:36px;border-radius:4px}header b{font-size:17px}
nav{display:flex;overflow:auto;background:#fff;border-bottom:1px solid var(--l)}
nav button{flex:none;padding:11px 14px;border:0;background:none;font:inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{border-color:var(--g);color:var(--g);font-weight:600}
main{max-width:900px;margin:auto;padding:12px}
.c{background:#fff;border:1px solid var(--l);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 6px;font-size:16px}
input,select{width:100%;padding:9px;border:1px solid var(--l);border-radius:7px;font:inherit}
label{font-size:12px;color:#5b6d63;display:block;margin-top:6px}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1;min-width:110px}
.b{background:var(--g);color:#fff;border:0;border-radius:7px;padding:10px 14px;font:inherit;cursor:pointer;margin-top:8px}
.b.s{background:#fff;color:var(--g);border:1px solid var(--g);padding:5px 9px;margin:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}
.n{text-align:right}.red{color:#b3261e}.mu{color:#5b6d63;font-size:13px}
.k{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.k>div{flex:1;min-width:140px;background:#fff;border:1px solid var(--l);border-radius:10px;padding:10px}.k b{font-size:19px;display:block}
#lg{max-width:340px;margin:50px auto;padding:12px;text-align:center}#lg img{max-width:100%;max-height:90px}
#pb{display:none}
@media print{body>*:not(#pb){display:none!important}#pb{display:block;padding:10px;color:#000}#pb table{width:100%}}
</style></head><body>
<div id="lg"><img id="lgi" alt=""><h2 id="lgn">MS Mobile Service Centre</h2>
<input id="em" type="email" placeholder="Email"><br><br><input id="pw" type="password" placeholder="Password">
<button class="b" onclick="login()">Sign in</button><p id="er" class="red"></p></div>
<div id="app" style="display:none"><header><img id="hi" alt=""><b id="hn"></b></header><nav id="nav"></nav><main id="main" oninput="dirty=1"></main></div>
<div id="pb"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,onSnapshot,setDoc,writeBatch,increment}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBIiaApdrz_aSymdznKpFAWUiAE-g--4bw",authDomain:"ms-mobile-db547.firebaseapp.com",projectId:"ms-mobile-db547",storageBucket:"ms-mobile-db547.firebasestorage.app",messagingSenderId:"510783666278",appId:"1:510783666278:web:a2e7daa520328bb437d5a7"});
const auth=getAuth(app),db=getFirestore(app),W=window,$=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>(+n||0).toFixed(2),fd=t=>new Date(t).toLocaleDateString('en-IN');
let D={spares:[],bills:[],purchases:[],expenses:[],suppliers:[],payments:[]},pg='bill',dirty=0,B={items:[]},PB={items:[]},ES=null,subd=0;
let S={n:'MS Mobile Service Centre',a:'Sathik Basha Nagar, Chikkanna College Road, Tirupur - 2',p:'93615 99748',g:'',logo:''};
const NAV=[['bill','Billing'],['spares','Spare parts'],['buy','Purchases'],['sup','Suppliers'],['exp','Expenses'],['cus','Customers'],['rep','Reports'],['set','Settings']];
const run=async f=>{try{await f()}catch(e){alert(e.message)}};
const val=i=>($(i)?$(i).value:'');
function head(){$('hn').textContent=S.n;$('lgn').textContent=S.n;[$('hi'),$('lgi')].forEach(e=>{e.src=S.logo||'';e.style.display=S.logo?'':'none'})}
W.login=()=>signInWithEmailAndPassword(auth,val('em'),val('pw')).catch(()=>{$('er').textContent='Wrong email or password.'});
onAuthStateChanged(auth,u=>{$('lg').style.display=u?'none':'';$('app').style.display=u?'':'none';if(u&&!subd){subd=1;sub()}});
function sub(){Object.keys(D).forEach(c=>onSnapshot(collection(db,c),s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));paint()}));
onSnapshot(doc(db,'settings','shop'),s=>{if(s.exists())S={...S,...s.data()};head();paint()})}
head();
function paint(){if(dirty&&(pg=='bill'||pg=='buy'))return;render()}
function render(){$('nav').innerHTML=NAV.map(([k,t])=>`<button class="${k==pg?'on':''}" onclick="go('${k}')">${t}</button>`).join('');$('main').innerHTML=P[pg]()}
W.go=k=>{pg=k;dirty=0;ES=null;render()};
const dl=(id,a)=>`<datalist id="${id}">${a.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
const spl=()=>dl('spl',D.spares.map(s=>s.id+' - '+s.n));
const find=v=>D.spares.find(x=>v.startsWith(x.id+' - '));
// ---- billing
const BF=['cn','cp','dv','gst','dis','pay'];
const keep=()=>BF.forEach(k=>{if($(k))B[k]=$(k).value});
function tt(){keep();const s=B.items.reduce((a,i)=>a+i.q*i.p,0),d=Math.min(+B.dis||0,s),g=(s-d)*(+B.gst||0)/100,t=s-d+g;if($('tt'))$('tt').textContent=`Subtotal ${m(s)} | GST ${m(g)} | Total ₹${m(t)}`;return{s,d,g,t}}
W.tt=tt;
W.al=()=>{keep();const v=val('li').trim(),q=+val('lq')||1;let p=val('lp');if(!v)return;const s=find(v);
if(s){if(s.stock<q&&!confirm('Only '+s.stock+' in stock. Add anyway?'))return;B.items.push({id:s.id,n:s.n,q,p:p===''?+s.p:+p,c:+s.c||0})}else B.items.push({n:v,q,p:+p||0,c:0});dirty=1;render()};
W.rl=i=>{keep();B.items.splice(i,1);dirty=1;render()};
W.sb=()=>run(async()=>{const t=tt();if(!B.items.length)return alert('Add items first.');const no=Math.max(1000,...D.bills.map(b=>b.no||0))+1;
const b={no,ts:Date.now(),cn:B.cn||'Walk-in',cp:B.cp||'',dv:B.dv||'',items:B.items,s:t.s,d:t.d,g:t.g,gp:+B.gst||0,t:t.t,pay:B.pay||'Cash'};
const w=writeBatch(db);w.set(doc(collection(db,'bills')),b);B.items.forEach(i=>{if(i.id)w.update(doc(db,'spares',i.id),{stock:increment(-i.q)})});await w.commit();B={items:[]};dirty=0;render();pbill(b)});
function pbill(b){$('pb').innerHTML=`<div style="text-align:center">${S.logo?`<img src="${S.logo}" style="max-height:70px"><br>`:''}<h2 style="margin:4px">${esc(S.n)}</h2>${esc(S.a)}<br>Phone: ${esc(S.p)}${S.g?' | GSTIN: '+esc(S.g):''}</div><hr>
<b>Bill #${b.no}</b> &nbsp; ${fd(b.ts)}<br>Customer: ${esc(b.cn)} ${esc(b.cp)}${b.dv?'<br>Device: '+esc(b.dv):''}
<table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${b.items.map(i=>`<tr><td>${esc(i.n)}</td><td>${i.q}</td><td>${m(i.p)}</td><td>${m(i.q*i.p)}</td></tr>`).join('')}</table>
<p style="text-align:right">Subtotal ₹${m(b.s)}<br>${b.d?'Discount -₹'+m(b.d)+'<br>':''}${b.g?'GST ('+b.gp+'%) ₹'+m(b.g)+'<br>':''}<b style="font-size:18px">Total ₹${m(b.t)}</b><br>Paid by: ${esc(b.pay)}</p><p style="text-align:center">Thank you. Please visit again.</p>`;setTimeout(()=>print(),200)}
W.vb=n=>pbill(D.bills.find(b=>b.no==n));
// ---- pages
const P={
bill(){const t=B.items.reduce((a,i)=>a+i.q*i.p,0);return spl()+`<div class=c><h3>Customer</h3><div class=r><div><label>Name</label><input id=cn value="${esc(B.cn)}"></div><div><label>Phone</label><input id=cp inputmode=tel value="${esc(B.cp)}"></div><div><label>Device</label><input id=dv value="${esc(B.dv)}"></div></div></div>
<div class=c><h3>Items</h3><div class=r><div style="flex:3"><label>Spare (code or name) or service</label><input id=li list=spl></div><div><label>Qty</label><input id=lq type=number value=1></div><div><label>Price</label><input id=lp type=number></div></div><button class=b onclick="al()">Add item</button>
<div class=tw><table>${B.items.map((i,x)=>`<tr><td>${esc(i.n)}</td><td>${i.q} × ${m(i.p)}</td><td class=n>${m(i.q*i.p)}</td><td><button class="b s" onclick="rl(${x})">x</button></td></tr>`).join('')}</table></div>
<div class=r><div><label>GST %</label><input id=gst type=number value="${B.gst||0}" oninput="tt()"></div><div><label>Discount ₹</label><input id=dis type=number value="${B.dis||0}" oninput="tt()"></div><div><label>Payment</label><select id=pay>${['Cash','UPI','Card'].map(o=>`<option ${B.pay==o?'selected':''}>${o}</option>`).join('')}</select></div></div>
<p id=tt><b>Total ₹${m(t)}</b></p><button class=b onclick="sb()">Save and print bill</button></div>`},
spares(){const e=ES!==null?D.spares[ES]:{};return `<div class=c><h3>${ES!==null?'Edit':'Add'} spare part</h3><div class=r><div><label>Code (number)</label><input id=sc value="${esc(e.id)}" ${ES!==null?'readonly':''}></div><div style="flex:2"><label>Name</label><input id=sn value="${esc(e.n)}"></div></div>
<div class=r><div><label>Buying cost</label><input id=sq type=number value="${e.c??''}"></div><div><label>Selling price</label><input id=sp type=number value="${e.p??''}"></div><div><label>Stock</label><input id=ss type=number value="${e.stock??0}"></div><div><label>Low stock alert at</label><input id=sm type=number value="${e.min??2}"></div></div><button class=b onclick="ssv()">Save spare</button></div>
<div class="c tw"><table><tr><th>Code</th><th>Name</th><th>Cost</th><th>Price</th><th>Stock</th><th></th></tr>${D.spares.sort((a,b)=>a.id>b.id?1:-1).map((s,i)=>`<tr><td>${esc(s.id)}</td><td>${esc(s.n)}</td><td>${m(s.c)}</td><td>${m(s.p)}</td><td class="${s.stock<=s.min?'red':''}">${s.stock}</td><td><button class="b s" onclick="se(${i})">Edit</button></td></tr>`).join('')||'<tr><td>No spares yet. Add your first one above.</td></tr>'}</table></div>`},
buy(){const t=PB.items.reduce((a,i)=>a+i.q*i.c,0);return spl()+dl('sul',D.suppliers.map(s=>s.id))+`<div class=c><h3>Buy spares from a supplier</h3><label>Supplier</label><input id=bs list=sul value="${esc(PB.sup)}"><div class=r><div style="flex:3"><label>Spare (pick from list)</label><input id=bi list=spl></div><div><label>Qty</label><input id=bq type=number value=1></div><div><label>Cost each</label><input id=bc type=number></div></div><button class=b onclick="pa()">Add</button>
<div class=tw><table>${PB.items.map((i,x)=>`<tr><td>${esc(i.n)}</td><td>${i.q} × ${m(i.c)}</td><td class=n>${m(i.q*i.c)}</td><td><button class="b s" onclick="pr(${x})">x</button></td></tr>`).join('')}</table></div>
<p><b>Total ₹${m(t)}</b></p><label>Paid now (rest becomes supplier due)</label><input id=bp type=number value="${PB.paid??t}"><button class=b onclick="ps()">Save purchase</button></div>
<div class="c tw"><h3>Recent purchases</h3><table>${D.purchases.slice(0,15).map(p=>`<tr><td>${fd(p.ts)}</td><td>${esc(p.sup)}</td><td class=n>${m(p.total)}</td><td class=n>due ${m(p.total-p.paid)}</td></tr>`).join('')}</table></div>`},
sup(){return `<div class="c tw"><h3>Supplier dues</h3><table><tr><th>Supplier</th><th>You owe</th><th></th></tr>${D.suppliers.map((s,i)=>`<tr><td>${esc(s.id)}</td><td class="${s.due>0?'red':''}">${m(s.due)}</td><td><button class="b s" onclick="sp2(${i})">Pay</button></td></tr>`).join('')||'<tr><td>No suppliers yet.</td></tr>'}</table><p><b>Total due ₹${m(D.suppliers.reduce((a,s)=>a+(s.due||0),0))}</b></p></div>`},
exp(){const mo=ms(Date.now());return dl('el',['Rent','Salary','Electricity','Recharge','Transport','Tea and snacks','Other'])+`<div class=c><h3>Add expense</h3><div class=r><div><label>Type</label><input id=ec list=el></div><div><label>Amount</label><input id=ea type=number></div><div><label>Date</label><input id=ed type=date value="${new Date().toISOString().slice(0,10)}"></div><div><label>Note</label><input id=en></div></div><button class=b onclick="ea()">Save expense</button></div>
<div class="c tw"><h3>This month: ₹${m(D.expenses.filter(e=>e.ts>=mo).reduce((a,e)=>a+e.a,0))}</h3><table>${D.expenses.slice(0,40).map(e=>`<tr><td>${fd(e.ts)}</td><td>${esc(e.c)}</td><td>${esc(e.note)}</td><td class=n>${m(e.a)}</td></tr>`).join('')}</table></div>`},
cus(){const g={};D.bills.forEach(b=>{const k=b.cp||b.cn;g[k]=g[k]||{n:b.cn,p:b.cp,v:0,t:0};g[k].v++;g[k].t+=b.t});
return `<div class="c tw"><h3>Customers</h3><table><tr><th>Name</th><th>Phone</th><th>Visits</th><th>Total</th></tr>${Object.values(g).map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.p)}</td><td>${c.v}</td><td>${m(c.t)}</td></tr>`).join('')}</table></div><div class=c><h3>Find a bill</h3><input placeholder="Name, phone or bill number" oninput="bf(this.value)"><div id=bl class=tw>${bl('')}</div></div>`},
rep(){const n=Date.now(),a=(l,s)=>`<div><span class=mu>${l}</span><b>₹${m(s.pr)}</b><span class=mu>Sales ${m(s.rev)} | Parts ${m(s.cg)} | Expenses ${m(s.ex)}</span></div>`,w0=ws(n);let rows='';for(let i=0;i<8;i++){const f=w0-i*6048e5,s=sum(f,f+6048e5);rows+=`<tr><td>${fd(f)}</td><td>${s.n}</td><td class=n>${m(s.rev)}</td><td class=n>${m(s.pr)}</td></tr>`}
const low=D.spares.filter(s=>s.stock<=s.min);return `<div class=k>${a('Profit today',sum(sd(n),sd(n)+864e5))}${a('Profit this week',sum(w0,w0+6048e5))}${a('Profit this month',sum(ms(n),9e15))}</div>
<div class="c tw"><h3>Weekly revenue (profit = sales − cost of parts − expenses)</h3><table><tr><th>Week starting</th><th>Bills</th><th>Sales</th><th>Profit</th></tr>${rows}</table></div>
<div class=c><h3>Low stock</h3>${low.map(s=>`${esc(s.id)} - ${esc(s.n)}: <b class=red>${s.stock}</b><br>`).join('')||'All spares are well stocked.'}</div>`},
set(){return `<div class=c><h3>Shop details (shown on bills)</h3><label>Shop name</label><input id=an value="${esc(S.n)}"><label>Address</label><input id=aa value="${esc(S.a)}"><label>Phone</label><input id=ap value="${esc(S.p)}"><label>GST number (optional)</label><input id=ag value="${esc(S.g)}"><label>Logo</label><img id=lp2 src="${S.logo}" style="max-height:60px;display:block"><input type=file accept="image/*" onchange="lgo(this)"><button class=b onclick="sset()">Save details</button></div>
<div class=c><p class=mu>To add a staff login, open Firebase console → Authentication → Add user.</p><button class="b s" onclick="out()">Sign out</button></div>`}};
// ---- helpers and actions
const sd=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()},ws=t=>{const d=new Date(sd(t));d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()},ms=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
function sum(f,t){const bl=D.bills.filter(b=>b.ts>=f&&b.ts<t),rev=bl.reduce((a,b)=>a+b.t-b.g,0),cg=bl.reduce((a,b)=>a+b.items.reduce((x,i)=>x+i.q*(i.c||0),0),0),ex=D.expenses.filter(e=>e.ts>=f&&e.ts<t).reduce((a,e)=>a+e.a,0);return{rev,cg,ex,pr:rev-cg-ex,n:bl.length}}
const bl=q=>{q=q.toLowerCase();return `<table>${D.bills.filter(b=>(b.cn+' '+b.cp+' '+b.no).toLowerCase().includes(q)).slice(0,30).map(b=>`<tr><td>#${b.no}</td><td>${fd(b.ts)}</td><td>${esc(b.cn)}</td><td class=n>${m(b.t)}</td><td><button class="b s" onclick="vb(${b.no})">Print</button></td></tr>`).join('')}</table>`};
W.bf=q=>$('bl').innerHTML=bl(q);
W.se=i=>{ES=i;render()};
W.ssv=()=>run(async()=>{const id=val('sc').trim().replace(/[\/\s]/g,'_');if(!id||!val('sn'))return alert('Enter a code and a name.');await setDoc(doc(db,'spares',id),{n:val('sn'),c:+val('sq')||0,p:+val('sp')||0,stock:+val('ss')||0,min:+val('sm')||0},{merge:true});ES=null;render()});
W.pa=()=>{PB.sup=val('bs');const s=find(val('bi'));if(!s)return alert('Pick the spare from the list. Add new spares in Spare parts first.');const q=+val('bq')||1,c=val('bc')===''?+s.c:+val('bc');PB.items.push({id:s.id,n:s.n,q,c});dirty=1;render()};
W.pr=i=>{PB.sup=val('bs');PB.items.splice(i,1);dirty=1;render()};
W.ps=()=>run(async()=>{const sup=val('bs').trim();if(!sup||!PB.items.length)return alert('Enter the supplier and add items.');const total=PB.items.reduce((a,i)=>a+i.q*i.c,0),paid=Math.min(+val('bp')||0,total),w=writeBatch(db);
w.set(doc(collection(db,'purchases')),{ts:Date.now(),sup,items:PB.items,total,paid});PB.items.forEach(i=>w.update(doc(db,'spares',i.id),{stock:increment(i.q),c:i.c}));w.set(doc(db,'suppliers',sup),{due:increment(total-paid)},{merge:true});await w.commit();PB={items:[]};dirty=0;render()});
W.sp2=i=>run(async()=>{const s=D.suppliers[i],a=+prompt('Amount paid to '+s.id+' (₹)');if(!a)return;const w=writeBatch(db);w.set(doc(collection(db,'payments')),{ts:Date.now(),sup:s.id,a});w.update(doc(db,'suppliers',s.id),{due:increment(-a)});await w.commit()});
W.ea=()=>run(async()=>{const a=+val('ea');if(!a)return alert('Enter the amount.');await setDoc(doc(collection(db,'expenses')),{ts:new Date(val('ed')+'T12:00').getTime(),c:val('ec')||'Other',a,note:val('en')})});
W.lgo=f=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,400/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.logo=c.toDataURL('image/jpeg',.85);$('lp2').src=S.logo};i.src=r.result};r.readAsDataURL(f.files[0])};
W.sset=()=>run(async()=>{S={...S,n:val('an'),a:val('aa'),p:val('ap'),g:val('ag')};await setDoc(doc(db,'settings','shop'),S);alert('Saved.')});
W.out=()=>signOut(auth);
</script></body></html>
